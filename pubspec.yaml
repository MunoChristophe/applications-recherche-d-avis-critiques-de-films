name: cineavis
description: Application de recherche d'avis et critiques de films.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # HTTP client
  http: ^1.2.1

  # .env file support
  flutter_dotenv: ^5.1.0

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Open URLs / review links
  url_launcher: ^6.3.0

  # Cached network images (movie posters)
  cached_network_image: ^3.3.1

  # State management
  provider: ^6.1.2

  # Intl
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env.example
